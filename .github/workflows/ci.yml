name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate release resources
        run: |
          plutil -lint Calibrate/Info.plist
          plutil -lint Calibrate/PrivacyInfo.xcprivacy
          plutil -lint Calibrate/Calibrate.entitlements
          plutil -lint ExportOptions.plist

      - name: Build release configuration
        run: |
          xcodebuild build \
            -scheme Calibrate \
            -project Calibrate.xcodeproj \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Run unit tests
        run: |
          SIMULATOR_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          if [ -z "$SIMULATOR_ID" ]; then
            echo "No available iPhone simulator found"
            xcrun simctl list devices available
            exit 1
          fi
          xcodebuild test \
            -scheme Calibrate \
            -project Calibrate.xcodeproj \
            -destination "platform=iOS Simulator,id=${SIMULATOR_ID}" \
            CODE_SIGNING_ALLOWED=NO
